name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Single source of truth for the DB used by db:push, the dev server, and E2E.
# Absolute path → identical resolution for Prisma CLI and Prisma Client at runtime
# (a relative `file:./db/custom.db` is schema-relative for the CLI but ambiguous
# for the generated client, which silently strands the runtime on a missing file).
env:
  DATABASE_URL: file:${{ github.workspace }}/db/custom.db
  # Shared secret between the Next.js proxy and the ffmpeg-renderer (see
  # SECURITY.md — internal renderer authentication). A CI-local value is fine:
  # the renderer is loopback-only, and both sides run in the same job.
  CLIPFORGE_RENDERER_TOKEN: ci-test-internal-renderer-token

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck
      - name: Lint (eslint)
        run: bun run lint
      - name: Unit tests
        run: bun run test:unit
      - name: Ownership failure-injection tests (mocked db + renderer)
        run: bun run test:ownership

  build:
    name: production build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client + push schema
        run: |
          mkdir -p db
          bun run db:generate
          bun run db:push
      # NOTE: the step name is quoted — an unquoted `: ` inside a YAML plain
      # scalar is a parse error (this broke the whole workflow at one point).
      - name: "Build (strict gates: type errors fail the build)"
        run: bun run build

  e2e:
    name: render E2E (golden · security)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client + push schema
        run: |
          mkdir -p db
          bun run db:generate
          bun run db:push
      - name: Start ffmpeg-renderer mini-service
        run: |
          cd mini-services/ffmpeg-renderer
          nohup bun run index.ts > /tmp/renderer.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -H "X-ClipForge-Internal-Token: $CLIPFORGE_RENDERER_TOKEN" http://127.0.0.1:3003/ && break || sleep 1; done
          curl -sf -H "X-ClipForge-Internal-Token: $CLIPFORGE_RENDERER_TOKEN" http://127.0.0.1:3003/ > /dev/null # fail fast if renderer never came up
      - name: "Renderer-auth E2E (isolated instance — 401 matrix, fail-closed startup)"
        run: bun run test:renderer-auth
      - name: Start Next.js dev server
        run: |
          nohup bun run dev > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ && break || sleep 2; done
          curl -sf http://127.0.0.1:3000/ > /dev/null # fail fast if server never came up
      - name: Golden render E2E (frame-accurate cuts, 9:16, A/V sync, 60fps duration regression)
        run: bun run test:e2e
      - name: Render-security E2E (internal auth · job ownership · recipe validation · full-cut rejection)
        run: bun run test:render-security
      - name: Dump service logs on failure
        if: failure()
        run: |
          tail -50 /tmp/renderer.log || true
          tail -80 /tmp/next.log || true
